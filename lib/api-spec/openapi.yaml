    PnLJobRow:
      type: object
      required:
        [
          quoteId,
          title,
          customerName,
          status,
          createdAt,
          revenue,
          tradeCost,
          labourCost,
          grossProfit,
          marginPct,
        ]
      properties:
        quoteId: { type: integer }
        title: { type: string }
        customerName: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        revenue:
          {
            type: number,
            description: "materialsSubtotal + labourCost (ex-GST)",
          }
        tradeCost:
          {
            type: number,
            description: "Sum of material trade costs (estimated where trade cost unknown)",
          }
        labourCost: { type: number }
        grossProfit: { type: number }
        marginPct: { type: number, description: "grossProfit / revenue * 100" }
        tradeCostIsEstimated: { type: boolean }

    PnLMonthRow:
      type: object
      required:
        [
          month,
          revenue,
          tradeCost,
          labourCost,
          grossProfit,
          marginPct,
          jobCount,
        ]
      properties:
        month: { type: string, description: "YYYY-MM" }
        revenue: { type: number }
        tradeCost: { type: number }
        labourCost: { type: number }
        grossProfit: { type: number }
        marginPct: { type: number }
        jobCount: { type: integer }

    PnLReport:
      type: object
