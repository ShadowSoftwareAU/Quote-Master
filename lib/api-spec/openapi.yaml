          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
    delete:
      operationId: unlinkTeamMemberAccount
      tags: [team]
      summary: Remove a Clerk account link from a team member
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: integer }
