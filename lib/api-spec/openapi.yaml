openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quote Master API — decking quotes, materials, customers, and bookings.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: customers
  - name: materials
  - name: quotes
  - name: bookings
  - name: dashboard
  - name: storage
  - name: team
  - name: time
  - name: portfolio
  - name: referrals
  - name: profile
  - name: master-projects
  - name: trade-templates
  - name: cad-layouts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /onboarding:
    post:
      operationId: createOnboardingProfile
      tags: [profile]
      summary: Create or safely retry the authenticated user's business profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingProfileInput" }
      responses:
        "201":
          description: Profile created and Clerk metadata synchronised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfile" }
        "502":
          description: Profile saved but Clerk metadata synchronisation failed

  /settings/profile:
    get:
      operationId: getProfileSettings
      tags: [profile]
      summary: Get the authenticated user's business profile
      responses:
        "200":
          description: Current business profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfile" }
        "404":
          description: Profile not found
    put:
      operationId: updateProfileSettings
      tags: [profile]
      summary: Update the authenticated user's editable trade details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileSettingsInput" }
      responses:
        "200":
          description: Profile and Clerk metadata updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfile" }
        "404":
          description: Profile not found
        "502":
          description: Profile saved but Clerk metadata synchronisation failed

  /dev/seed-demo-data:
    post:
      operationId: seedDemoData
      tags: [profile]
      summary: Seed temporary presentation data for the authenticated Owner
      description: Development-only action that creates a scoped sample workspace. It is unavailable in production and can only be run once per workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedDemoDataInput" }
      responses:
        "201":
          description: Demo workspace created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedDemoDataResponse" }
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Owner role is required
        "404":
          description: Unavailable outside development
        "409":
          description: Demo data already exists for this workspace

  /settings/profile/master-builder:
    patch:
      operationId: setMasterBuilderFlag
      tags: [profile]
      summary: Set the authenticated Owner's Master Builder test flag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterBuilderFlagInput" }
      responses:
        "200":
          description: Updated business profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfile" }
        "403":
          description: Owner role is required

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Headline numbers for the home screen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [dashboard]
      summary: Owner-only business overview metrics
      responses:
        "200":
          description: Pipeline, year-to-date revenue, and quote win rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsOverview" }
        "401":
          description: Authentication required
        "403":
          description: Owner role is required

  /dashboard/pnl:
    get:
      operationId: getPnlReport
      tags: [dashboard]
      summary: P&L breakdown per accepted quote and monthly rollup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PnLReport" }
        "403":
          description: Owner role is required

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    patch:
      operationId: updateCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionSuccess" }

  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }
    post:
      operationId: createMaterial
      tags: [materials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
  /materials/{id}:
    patch:
      operationId: updateMaterial
      tags: [materials]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
    delete:
      operationId: deleteMaterial
      tags: [materials]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionSuccess" }

  /trade-templates:
    get:
      operationId: listTradeTemplates
      tags: [trade-templates]
      summary: List the seeded trade-specific quote templates
      responses:
        "200":
          description: Available trade templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TradeTemplate" }

  /trade-catalogue:
    get:
      operationId: listTradeCatalogue
      tags: [trade-templates]
      summary: List supported trades and their quoting foundations
      responses:
        "200":
          description: Supported trade catalogue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TradeCatalogueEntry" }

  /trade-template-presets:
    get:
      operationId: listTradeTemplatePresets
      tags: [trade-templates]
      summary: List the authenticated builder's presets for a selected trade
      parameters:
        - in: query
          name: tradeType
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Personal quick-add presets for the builder's primary trade
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TradeTemplatePreset" }
        "401":
          description: Authentication required
        "403":
          description: Owner or Employee role is required
        "409":
          description: Business onboarding must be completed
    post:
      operationId: saveTradeTemplatePreset
      tags: [trade-templates]
      summary: Save or update a personal preset for the authenticated builder's primary trade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeTemplatePresetInput" }
      responses:
        "201":
          description: Personal preset saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeTemplatePreset" }
        "400":
          description: Invalid preset
        "401":
          description: Authentication required
        "403":
          description: Owner or Employee role is required
        "409":
          description: Business onboarding must be completed

  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuoteSummary" }
    post:
      operationId: createQuote
      tags: [quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    patch:
      operationId: updateQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    delete:
      operationId: deleteQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionSuccessWithId" }
  /quotes/{quoteId}/cad-layouts:
    get:
      operationId: getLatestCadLayout
      tags: [cad-layouts]
      summary: Get the latest validated CAD layout for an owned quote
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Latest persisted CAD layout and its deterministic compliance evaluation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CadGeneratedLayout" }
        "400":
          description: Invalid quote identifier
        "401":
          description: Authentication required
        "404":
          description: Quote or generated layout not found
        "500":
          description: CAD layout retrieval failed
    post:
      operationId: createCadLayout
      tags: [cad-layouts]
      summary: Generate and store a validated CAD layout from natural language
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CadLayoutPromptInput" }
      responses:
        "201":
          description: CAD layout generated, evaluated for compliance, and stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CadGeneratedLayout" }
        "400":
          description: Invalid prompt or quote identifier
        "401":
          description: Authentication required
        "404":
          description: Quote not found
        "422":
          description: Prompt could not be converted into a valid CAD layout
        "500":
          description: CAD layout generation or persistence failed
  /quotes/{id}/status:
    patch:
      operationId: setQuoteStatus
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteStatusInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /quote/{token}:
    get:
      operationId: getQuotePortal
      tags: [quotes]
      summary: Get the customer-safe view of a quote
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotePortal" }
    patch:
      operationId: updateQuotePortal
      tags: [quotes]
      summary: Apply an allowed customer upgrade using a secure portal token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotePortalUpgradeInput" }
      responses:
        "200":
          description: Updated customer-safe quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotePortal" }
        "409":
          description: Quote was already accepted and can no longer be changed

  /quote/{token}/status:
    patch:
      operationId: setQuotePortalStatus
      tags: [quotes]
      summary: Accept a quote using a secure portal token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteStatusInput" }
      responses:
        "200":
          description: Accepted customer-safe quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotePortal" }

  /quotes/{id}/portal-token:
    post:
      operationId: regenerateQuotePortalToken
      tags: [quotes]
      summary: Replace a quote's public portal token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Token regenerated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotePortalToken" }
    delete:
      operationId: revokeQuotePortalToken
      tags: [quotes]
      summary: Revoke a quote's public portal token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotePortalRevocation" }
  /quotes/{id}/pdf:
    get:
      operationId: getQuotePdf
      tags: [quotes]
      summary: Download an authenticated quote PDF
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Quote PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /quotes/estimate:
    post:
      operationId: estimateDeck
      tags: [quotes]
      summary: Calculate a bill of materials from deck dimensions without saving
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeckSpecInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteEstimate" }

  /master-projects:
    get:
      operationId: listMasterProjects
      tags: [master-projects]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MasterProjectSummary" }
    post:
      operationId: createMasterProject
      tags: [master-projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProject" }

  /master-projects/{id}:
    get:
      operationId: getMasterProject
      tags: [master-projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProject" }
    patch:
      operationId: updateMasterProject
      tags: [master-projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterProjectUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProject" }
    delete:
      operationId: deleteMasterProject
      tags: [master-projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessWithId" }

  /master-projects/{id}/quotes:
    put:
      operationId: setMasterProjectQuotes
      tags: [master-projects]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterProjectQuoteSelection" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProject" }

  /master-projects/{id}/pdf:
    get:
      operationId: getMasterProjectPdf
      tags: [master-projects]
      summary: Download an authenticated Master Project proposal PDF
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Master Project proposal PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /master-projects/{id}/portal-token:
    post:
      operationId: regenerateMasterProjectPortalToken
      tags: [master-projects]
      summary: Replace a Master Project's public portal token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Token regenerated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProjectPortalToken" }
    delete:
      operationId: revokeMasterProjectPortalToken
      tags: [master-projects]
      summary: Revoke a Master Project's public portal token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/MasterProjectPortalRevocation" }

  /master-project/{token}:
    get:
      operationId: getMasterProjectPortal
      tags: [master-projects]
      summary: Get a customer-safe Master Project proposal using a secure token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: Customer-safe Master Project proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProjectPortal" }

  /master-project/{token}/status:
    patch:
      operationId: setMasterProjectPortalStatus
      tags: [master-projects]
      summary: Accept a Master Project proposal using a secure token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteStatusInput" }
      responses:
        "200":
          description: Accepted customer-safe Master Project proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProjectPortal" }

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      operationId: createBooking
      tags: [bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
  /bookings/{id}:
    patch:
      operationId: updateBooking
      tags: [bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
    delete:
      operationId: deleteBooking
      tags: [bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionSuccess" }
  /bookings/{id}/photos:
    post:
      operationId: addBookingPhoto
      tags: [bookings]
      summary: Attach an uploaded object path to a booking's photo evidence list
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddBookingPhotoInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
    delete:
      operationId: removeBookingPhoto
      tags: [bookings]
      summary: Remove a photo from a booking
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveBookingPhotoInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }

  /storage/uploads/request-url:
    post:
      operationId: requestStorageUploadUrl
      tags: [storage]
      summary: Request a presigned URL for an authenticated object upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageUploadRequest" }
      responses:
        "200":
          description: Upload URL created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageUploadResponse" }
        "400":
          description: Invalid upload metadata

  /quotes/{id}/variation:
    post:
      operationId: createQuoteVariation
      tags: [quotes]
      summary: Create a variation quote based on an existing quote
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteVariationInput" }
      responses:
        "201":
          description: Created
