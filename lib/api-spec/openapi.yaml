openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Deck Me API — decking quotes, materials, customers, and bookings.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: customers
  - name: materials
  - name: quotes
  - name: bookings
  - name: dashboard
  - name: storage
  - name: team
  - name: time
  - name: portfolio
  - name: referrals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Headline numbers for the home screen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/pnl:
    get:
      operationId: getPnlReport
      tags: [dashboard]
      summary: P&L breakdown per accepted quote and monthly rollup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PnLReport" }

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    patch:
      operationId: updateCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }
    post:
      operationId: createMaterial
      tags: [materials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
  /materials/{id}:
    patch:
      operationId: updateMaterial
      tags: [materials]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
    delete:
      operationId: deleteMaterial
      tags: [materials]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuoteSummary" }
    post:
      operationId: createQuote
      tags: [quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    patch:
      operationId: updateQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    delete:
      operationId: deleteQuote
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /quotes/{id}/status:
    patch:
      operationId: setQuoteStatus
      tags: [quotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteStatusInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /quotes/{id}/portal:
    get:
      operationId: getQuotePortal
      tags: [quotes]
      summary: Get the customer-safe view of a quote
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotePortal" }
  /quotes/estimate:
    post:
      operationId: estimateDeck
      tags: [quotes]
      summary: Calculate a bill of materials from deck dimensions without saving
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeckSpecInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteEstimate" }

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      operationId: createBooking
      tags: [bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
  /bookings/{id}:
    patch:
      operationId: updateBooking
      tags: [bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
    delete:
      operationId: deleteBooking
      tags: [bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /bookings/{id}/photos:
    post:
      operationId: addBookingPhoto
      tags: [bookings]
      summary: Attach an uploaded object path to a booking's photo evidence list
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddBookingPhotoInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
    delete:
      operationId: removeBookingPhoto
      tags: [bookings]
      summary: Remove a photo from a booking
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveBookingPhotoInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }

  /quotes/{id}/variation:
    post:
      operationId: createQuoteVariation
      tags: [quotes]
      summary: Create a variation quote based on an existing quote
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteVariationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }


  # ── Team Members ───────────────────────────────────────────────────────
  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List all team members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
    post:
      operationId: createTeamMember
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }

  /team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMemberUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
    delete:
      operationId: deleteTeamMember
      tags: [team]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deactivated

  /team/{memberId}/assign/{jobId}:
    post:
      operationId: assignTeamMemberToJob
      tags: [team]
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: integer }
        - in: path
          name: jobId
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignJobInput" }
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAssignment" }

  /bookings/{jobId}/assignments:
    get:
      operationId: listJobAssignments
      tags: [team]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobAssignment" }
    delete:
      operationId: removeJobAssignment
      tags: [team]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveAssignmentInput" }
      responses:
        "204":
          description: Removed

  # ── Time Tracking ───────────────────────────────────────────────────────
  /time/clock-on:
    post:
      operationId: clockOn
      tags: [time]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockOnInput" }
      responses:
        "201":
          description: Clocked on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }

  /time/clock-off:
    post:
      operationId: clockOff
      tags: [time]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockOffInput" }
      responses:
        "200":
          description: Clocked off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }

  /time/manual:
    post:
      operationId: addManualTimeEntry
      tags: [time]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualTimeEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }

  /time/job/{jobId}:
    get:
      operationId: listTimeEntriesForJob
      tags: [time]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeEntry" }

  /time/member/{memberId}:
    get:
      operationId: listTimeEntriesForMember
      tags: [time]
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeEntry" }

  # ── Portfolio ───────────────────────────────────────────────────────────
  /portfolio:
    get:
      operationId: listPortfolioEntries
      tags: [portfolio]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PortfolioEntry" }
    post:
      operationId: createPortfolioEntry
      tags: [portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioEntry" }

  /portfolio/{id}:
    patch:
      operationId: updatePortfolioEntry
      tags: [portfolio]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioEntryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioEntry" }
    delete:
      operationId: deletePortfolioEntry
      tags: [portfolio]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /portfolio/{id}/photos:
    post:
      operationId: addPortfolioPhoto
      tags: [portfolio]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddPortfolioPhotoInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioEntry" }

  # ── Referrals ───────────────────────────────────────────────────────────
  /referrals/sources:
    get:
      operationId: listReferralSources
      tags: [referrals]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReferralSource" }
    post:
      operationId: createReferralSource
      tags: [referrals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralSourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralSource" }

  /referrals/sources/{code}/qr:
    get:
      operationId: getReferralQrCode
      tags: [referrals]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        "200":
          description: QR code PNG image
          content:
            image/png:
              schema: { type: string, format: binary }

  /referrals/leads:
    get:
      operationId: listSignUpLeads
      tags: [referrals]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SignUpLead" }
    post:
      operationId: createSignUpLead
      tags: [referrals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpLeadInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignUpLead" }


components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Customer:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        company: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        notes: { type: string }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        notes: { type: string }

    Material:
      type: object
      required: [id, name, category, unit, unitPrice, supplier]
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: ["string", "null"] }
        category:
          type: string
          description: "decking | joist | bearer | post | stump | screw | nail | bracket | sealant | other"
        unit:
          type: string
          description: "each | metre | pack | bag"
        unitPrice: { type: number, description: "Retail price per unit (AUD) — shown on client quotes" }
        tradeCost: { type: ["number", "null"], description: "Your trade/buy price — never shown to clients" }
        packSize: { type: ["integer", "null"], description: "Items per pack, if unit=pack" }
        supplier:
          type: string
          description: "bunnings | mitre10 | local | other"
        notes: { type: ["string", "null"] }
    MaterialInput:
      type: object
      required: [name, category, unit, unitPrice, supplier]
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: string }
        category: { type: string }
        unit: { type: string }
        unitPrice: { type: number }
        tradeCost: { type: number }
        packSize: { type: integer }
        supplier: { type: string }
        notes: { type: string }
    MaterialUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: string }
        category: { type: string }
        unit: { type: string }
        unitPrice: { type: number }
        tradeCost: { type: number }
        packSize: { type: integer }
        supplier: { type: string }
        notes: { type: string }

    DeckSpecInput:
      type: object
      required: [lengthM, widthM]
      properties:
        lengthM: { type: number, description: "Deck length in metres" }
        widthM: { type: number, description: "Deck width in metres" }
        heightM: { type: number, description: "Sub-floor height in metres", default: 0.6 }
        boardWidthMm: { type: integer, description: "Decking board width in mm", default: 90 }
        gapSpacingMm: { type: integer, description: "Gap between boards in mm", default: 4 }
        joistSpacingMm: { type: integer, description: "Joist centres in mm", default: 450 }
        bearerSpacingMm: { type: integer, description: "Bearer centres in mm", default: 1800 }
        postSpacingMm: { type: integer, description: "Post centres in mm", default: 1800 }
        footingDepthMm: { type: integer, description: "Footing depth in mm for stump subframes", default: 450 }
        wastageFactor: { type: number, description: "Multiplier for cuts and offcuts", default: 1.1 }
        labourHours: { type: number, description: "Labour hours for the job", default: 0 }
        labourRate: { type: number, description: "AUD per hour labour rate", default: 85 }
        deckBoardType: { type: string, description: "hardwood | composite | treated_pine", default: "treated_pine" }
        subframeType: { type: string, description: "stumps | concrete_slab | existing_structure", default: "stumps" }
        fastenerType: { type: string, description: "screws | hidden_clips", default: "screws" }
        fasciaType: { type: string, description: "none | timber | composite", default: "none" }
        includeHandrails: { type: boolean, default: false }
        handrailHeightMm: { type: integer, description: "Handrail height in mm", default: 1000 }
        balustradeType: { type: string, description: "timber | stainless_cable", default: "timber" }
        timberGapMm: { type: integer, description: "Gap between timber pickets in mm", default: 15 }
        wireSpacingMm: { type: integer, description: "Stainless cable wire spacing in mm", default: 100 }
        includeStairs: { type: boolean, default: false }
        stairFlights: { type: integer, description: "Number of stair flights", default: 1 }
        includeFencing: { type: boolean, default: false }
        fencingSides: { type: integer, description: "Number of sides with fencing", default: 1 }
        fencingHeightM: { type: number, description: "Fence height in metres", default: 1.8 }
        fencingWidthM: { type: number, description: "Fence bay/panel width in metres", default: 1.8 }
        includeAwning: { type: boolean, default: false }
        awningWidthM: { type: number, description: "Awning width in metres (creates cutout in boards)", default: 3 }
        awningLengthM: { type: number, description: "Awning length in metres", default: 3 }

    QuoteLineItem:
      type: object
      required: [id, quoteId, description, category, quantity, unit, unitPrice, lineTotal]
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        materialId: { type: ["integer", "null"] }
        description: { type: string }
        category: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unitPrice: { type: number }
        lineTotal: { type: number }

    QuoteEstimateLine:
      type: object
      required: [description, category, quantity, unit, unitPrice, lineTotal]
      properties:
        materialId: { type: ["integer", "null"] }
        description: { type: string }
        category: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unitPrice: { type: number }
        lineTotal: { type: number }

    QuoteEstimate:
      type: object
      required: [spec, lines, materialsSubtotal, labourCost, gst, total, complianceWarnings]
      properties:
