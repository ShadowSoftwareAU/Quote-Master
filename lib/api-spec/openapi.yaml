          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveAssignmentInput" }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionSuccess" }

  # ── Time Tracking ───────────────────────────────────────────────────────
  /time/clock-on:
