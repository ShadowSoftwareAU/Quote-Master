              schema: { $ref: "#/components/schemas/SignUpLead" }


components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    BusinessRole:
      type: string
      enum: [Owner, Employee, Subcontractor]
    BusinessProfile:
      type: object
      required: [id, businessName, phoneNumber, tradeType, role, isMasterBuilder, metadataSyncStatus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        businessName: { type: string }
        phoneNumber: { type: string }
        tradeType: { type: string }
        licenseNumber: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/BusinessRole" }
        isMasterBuilder: { type: boolean }
        metadataSyncStatus:
          type: string
          enum: [pending, synced, failed]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OnboardingProfileInput:
      type: object
      additionalProperties: false
      required: [businessName, phoneNumber, tradeType, role]
      properties:
        businessName: { type: string, minLength: 2, maxLength: 120 }
        phoneNumber:
          type: string
          minLength: 8
          maxLength: 20
          pattern: '^\+?[0-9 ()-]+$'
        tradeType: { type: string, minLength: 2, maxLength: 80 }
        licenseNumber:
          type: [string, "null"]
          minLength: 2
          maxLength: 50
          pattern: '^[A-Za-z0-9 ./-]+$'
        role: { $ref: "#/components/schemas/BusinessRole" }
    ProfileSettingsInput:
      type: object
      additionalProperties: false
      required: [tradeType, role]
      properties:
        tradeType: { type: string, minLength: 2, maxLength: 80 }
        licenseNumber:
          type: [string, "null"]
          minLength: 2
          maxLength: 50
          pattern: '^[A-Za-z0-9 ./-]+$'
        role: { $ref: "#/components/schemas/BusinessRole" }
    MasterBuilderFlagInput:
      type: object
      additionalProperties: false
      required: [isMasterBuilder]
      properties:
        isMasterBuilder: { type: boolean }

    SeedDemoDataInput:
      type: object
      additionalProperties: false

    SeedDemoDataResponse:
      type: object
      required: [seeded, counts, customerIds, materialIds, quoteIds, masterProjectId]
      properties:
        seeded: { type: boolean, const: true }
        counts:
          type: object
          required: [customers, materials, quotes, masterProjects]
          properties:
            customers: { type: integer, const: 5 }
            materials: { type: integer, const: 10 }
            quotes: { type: integer, const: 4 }
            masterProjects: { type: integer, const: 1 }
        customerIds:
          type: array
          items: { type: integer }
        materialIds:
          type: array
          items: { type: integer }
        quoteIds:
          type: array
          items: { type: integer }
        masterProjectId: { type: integer }

    DeletionSuccess:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean, const: true }
    DeletionSuccessWithId:
      type: object
      required: [deleted, id]
      properties:
        deleted: { type: boolean, const: true }
        id: { type: integer }
    SuccessWithId:
      type: object
      required: [success, id]
      properties:
        success: { type: boolean, const: true }
        id: { type: integer }

    StorageUploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 0 }
        contentType: { type: string, minLength: 1 }
    StorageUploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }

    Customer:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        company: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        notes: { type: string }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        notes: { type: string }

    Material:
      type: object
      required: [id, name, category, unit, unitPrice, supplier, lastUpdated]
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: ["string", "null"] }
        vendorName: { type: ["string", "null"], description: "Canonical vendor name, ready for live supplier integrations" }
        vendorSku: { type: ["string", "null"], description: "Vendor-specific product SKU" }
        category:
          type: string
          description: "decking | joist | bearer | post | stump | screw | nail | bracket | sealant | other"
        unit:
          type: string
          description: "each | metre | pack | bag"
        unitPrice: { type: number, description: "Retail price per unit (AUD) — shown on client quotes" }
        tradeCost: { type: ["number", "null"], description: "Your trade/buy price — never shown to clients" }
        packSize: { type: ["integer", "null"], description: "Items per pack, if unit=pack" }
        supplier:
          type: string
          description: "bunnings | mitre10 | local | other"
        notes: { type: ["string", "null"] }
        lastUpdated: { type: string, format: date-time }
    MaterialInput:
      type: object
      required: [name, category, unit, unitPrice, supplier]
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: string }
        vendorName: { type: string }
        vendorSku: { type: string }
        category: { type: string }
        unit: { type: string }
        unitPrice: { type: number }
        tradeCost: { type: number }
        packSize: { type: integer }
        supplier: { type: string }
        notes: { type: string }
    MaterialUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: string }
        vendorName: { type: string }
        vendorSku: { type: string }
        category: { type: string }
        unit: { type: string }
        unitPrice: { type: number }
        tradeCost: { type: number }
        packSize: { type: integer }
        supplier: { type: string }
        notes: { type: string }

    DeckSpecInput:
      type: object
      required: [lengthM, widthM]
      properties:
        lengthM: { type: number, description: "Deck length in metres" }
        widthM: { type: number, description: "Deck width in metres" }
        heightM: { type: number, description: "Sub-floor height in metres", default: 0.6 }
        boardWidthMm: { type: integer, description: "Decking board width in mm", default: 90 }
        gapSpacingMm: { type: integer, description: "Gap between boards in mm", default: 4 }
        joistSpacingMm: { type: integer, description: "Joist centres in mm", default: 450 }
        bearerSpacingMm: { type: integer, description: "Bearer centres in mm", default: 1800 }
        postSpacingMm: { type: integer, description: "Post centres in mm", default: 1800 }
        footingDepthMm: { type: integer, description: "Footing depth in mm for stump subframes", default: 450 }
        wastageFactor: { type: number, description: "Multiplier for cuts and offcuts", default: 1.1 }
        labourHours: { type: number, description: "Labour hours for the job", default: 0 }
        labourRate: { type: number, description: "AUD per hour labour rate", default: 85 }
        deckBoardType: { type: string, description: "hardwood | composite | treated_pine", default: "treated_pine" }
        subframeType: { type: string, description: "stumps | concrete_slab | existing_structure", default: "stumps" }
        fastenerType: { type: string, description: "screws | hidden_clips", default: "screws" }
        fasciaType: { type: string, description: "none | timber | composite", default: "none" }
        includeHandrails: { type: boolean, default: false }
        handrailHeightMm: { type: integer, description: "Handrail height in mm", default: 1000 }
        balustradeType: { type: string, description: "timber | stainless_cable", default: "timber" }
        timberGapMm: { type: integer, description: "Gap between timber pickets in mm", default: 15 }
        wireSpacingMm: { type: integer, description: "Stainless cable wire spacing in mm", default: 100 }
        includeStairs: { type: boolean, default: false }
        stairFlights: { type: integer, description: "Number of stair flights", default: 1 }
        includeFencing: { type: boolean, default: false }
        fencingSides: { type: integer, description: "Number of sides with fencing", default: 1 }
        fencingHeightM: { type: number, description: "Fence height in metres", default: 1.8 }
        fencingWidthM: { type: number, description: "Fence bay/panel width in metres", default: 1.8 }
        includeAwning: { type: boolean, default: false }
        awningWidthM: { type: number, description: "Awning width in metres (creates cutout in boards)", default: 3 }
        awningLengthM: { type: number, description: "Awning length in metres", default: 3 }

    QuoteLineItem:
      type: object
      required: [id, quoteId, description, category, quantity, unit, unitType, unitPrice, wastagePercentage, isBulkItem, lineTotal]
      properties:
        id: { type: integer }
        quoteId: { type: integer }
        materialId: { type: ["integer", "null"] }
        description: { type: string }
        category: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unitType: { type: string }
        unitPrice: { type: number }
        unitCost: { type: number }
        markupPercentage: { type: number }
        wastagePercentage: { type: number }
        isBulkItem: { type: boolean }
        lineTotal: { type: number }

    PublicQuoteLineItem:
      type: object
      required: [description, category, quantity, unit, unitType, unitPrice, lineTotal]
      properties:
        description: { type: string }
        category: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unitType: { type: string }
        unitPrice: { type: number }
        lineTotal: { type: number }

    QuoteLineItemInput:
      type: object
      required: [description, quantity, unitCost, markupPercentage]
      additionalProperties: false
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        unitCost: { type: number, minimum: 0, maximum: 9000 }
        markupPercentage: { type: number, minimum: 0, maximum: 1000 }
        unit: { type: string, minLength: 1, maxLength: 40, default: each }
        unitType:
          type: string
          enum: [sqm, lm, m3, item, box]
          default: item
        wastagePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 0
        isBulkItem:
          type: boolean
          default: false
        saveToMyPresets:
          type: boolean
          default: false

    TradeTemplatePresetInput:
      type: object
      required: [description, quantity, unitCost, markupPercentage]
      additionalProperties: false
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        unitCost: { type: number, minimum: 0, maximum: 9000 }
        markupPercentage: { type: number, minimum: 0, maximum: 1000 }
        unit: { type: string, minLength: 1, maxLength: 40, default: each }
        unitType:
          type: string
          enum: [sqm, lm, m3, item, box]
          default: item
        wastagePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 0
        isBulkItem:
          type: boolean
          default: false

    TradeTemplatePreset:
      allOf:
        - $ref: "#/components/schemas/TradeTemplatePresetInput"
        - type: object
          required: [id, tradeType, category, unit, unitType, wastagePercentage, isBulkItem]
          properties:
            id: { type: integer }
            tradeType: { type: string }
            category: { type: string }

    QuoteEstimateLine:
      type: object
      required: [description, category, quantity, unit, unitType, unitPrice, wastagePercentage, isBulkItem, lineTotal]
      properties:
        materialId: { type: ["integer", "null"] }
        description: { type: string }
        category: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unitType: { type: string }
        unitPrice: { type: number }
        wastagePercentage: { type: number }
        isBulkItem: { type: boolean }
        lineTotal: { type: number }

    TradeTemplateLineItem:
      type: object
      required: [description, category, quantity, unit, unitType, unitCost, markupPercentage, wastagePercentage, isBulkItem]
      properties:
        description: { type: string }
        category: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unitType:
          type: string
          enum: [sqm, lm, m3, item, box]
        unitCost: { type: number }
        markupPercentage: { type: number }
        wastagePercentage: { type: number }
        isBulkItem: { type: boolean }

    TradeTemplate:
      type: object
      required: [id, tradeType, name, slug, defaultLineItems]
      properties:
        id: { type: integer }
        tradeType: { type: string }
        name: { type: string }
        slug: { type: string }
        defaultLineItems:
          type: array
          items: { $ref: "#/components/schemas/TradeTemplateLineItem" }

    QuoteEstimate:
      type: object
      required: [spec, lines, materialsSubtotal, labourCost, gst, total, complianceWarnings]
      properties:
        spec: { $ref: "#/components/schemas/DeckSpecInput" }
        deckAreaM2: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/QuoteEstimateLine" }
        materialsSubtotal: { type: number }
        labourCost: { type: number }
        gst: { type: number }
        total: { type: number }
        complianceWarnings:
          type: array
          items: { $ref: "#/components/schemas/ComplianceWarning" }

    ComplianceWarning:
      type: object
      required: [code, severity, standard, title, message, actual, limit, recommendation]
      properties:
        code: { type: string }
        severity: { type: string, enum: [warning] }
        standard: { type: string }
        title: { type: string }
        message: { type: string }
        actual: { type: number }
        limit: { type: number }
        recommendation: { type: string }

    MasterProjectSummary:
      type: object
      required: [id, title, status, customerId, builderMarginPct, materialsSubtotal, labourSubtotal, marginAmount, gst, total, quoteCount, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        customerId: { type: integer }
        customerName: { type: ["string", "null"] }
        builderMarginPct: { type: number }
        materialsSubtotal: { type: number }
        labourSubtotal: { type: number }
        marginAmount: { type: number }
        gst: { type: number }
        total: { type: number }
        quoteCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MasterProjectQuote:
      type: object
      required: [id, title, status, customerId, tradeType, materialsSubtotal, labourCost, gst, total, lineItems, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        customerId: { type: integer }
        tradeType: { type: string }
        materialsSubtotal: { type: number }
        labourCost: { type: number }
        gst: { type: number }
        total: { type: number }
        lineItems:
          type: array
          items: { $ref: "#/components/schemas/QuoteLineItem" }
        createdAt: { type: string, format: date-time }

    MasterProjectPortalQuote:
      type: object
      required: [id, title, status, tradeType, materialsSubtotal, labourCost, gst, total, lineItems, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        tradeType: { type: string }
        materialsSubtotal: { type: number }
        labourCost: { type: number }
        gst: { type: number }
        total: { type: number }
        lineItems:
          type: array
          items: { $ref: "#/components/schemas/PublicQuoteLineItem" }
        createdAt: { type: string, format: date-time }

    MasterTradeGroup:
      type: object
      required: [tradeType, label, quotes]
      properties:
        tradeType: { type: string }
        label: { type: string }
        quotes:
          type: array
          items: { $ref: "#/components/schemas/MasterProjectQuote" }

    MasterProjectPortalTradeGroup:
      type: object
      required: [tradeType, label, quotes]
      properties:
        tradeType: { type: string }
        label: { type: string }
        quotes:
          type: array
          items: { $ref: "#/components/schemas/MasterProjectPortalQuote" }

    MasterBillOfMaterialsLine:
      type: object
