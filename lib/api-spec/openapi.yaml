          type: array
          items: { $ref: "#/components/schemas/PnLJobRow" }
        monthly:
          type: array
          items: { $ref: "#/components/schemas/PnLMonthRow" }
        totals:
          type: object
          required:
            [revenue, tradeCost, labourCost, grossProfit, marginPct, jobCount]
          properties:
            revenue: { type: number }
            tradeCost: { type: number }
            labourCost: { type: number }
            grossProfit: { type: number }
            marginPct: { type: number }
            jobCount: { type: integer }

    DashboardSummary:
      type: object
      description: Financial fields are returned only for authenticated Owners. Employees and Subcontractors receive the operational fields without financial values.
      required:
        [
          activeQuoteCount,
          acceptedQuoteCount,
          upcomingBookingCount,
          customerCount,
          recentQuotes,
          upcomingBookings,
        ]
      properties:
        activeQuoteCount: { type: integer }
        acceptedQuoteCount: { type: integer }
        totalQuoteValue:
          {
            type: number,
            description: "Owner-only total value across all quotes",
          }
        grossProfit:
          {
            type: number,
            description: "Owner-only total retail quote value minus total trade cost across all accepted quotes",
          }
        totalTradeCost:
          {
            type: number,
            description: "Owner-only sum of trade costs for all accepted quote materials",
          }
        upcomingBookingCount: { type: integer }
        customerCount: { type: integer }
        recentQuotes:
          type: array
          items: { $ref: "#/components/schemas/QuoteSummary" }
        upcomingBookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }

