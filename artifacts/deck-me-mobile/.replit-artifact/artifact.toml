kind = "mobile"
previewPath = "/mobile/"
title = "Deck Me Mobile"
version = "1.0.0"
id = "artifacts/deck-me-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22199

[services.development]
run = "pnpm --filter @workspace/deck-me-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deck-me-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/deck-me-mobile", "run", "serve" ]

[services.env]
PORT = "22199"
BASE_PATH = "/mobile/"
